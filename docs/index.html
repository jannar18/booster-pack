<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#dfeaf5" />
  <title>Lumen — Aurora Grove</title>
  <style>
    :root {
      color-scheme: light;
      font: 100%/1.45 ui-rounded, "SF Pro Rounded", "Avenir Next", "Segoe UI", system-ui, sans-serif;
      --ink: #20314e;
      --ink-soft: #647695;
      --violet: #6245a2;
      --violet-deep: #43276f;
      --gold: #f5aa47;
      --glass: rgba(248, 251, 255, 0.72);
      --glass-strong: rgba(245, 249, 254, 0.92);
      --glass-edge: rgba(255, 255, 255, 0.78);
      --page-gutter: clamp(0.875rem, 4vw, 1.5rem);
      --control-size: 3rem;
      --ease-out: cubic-bezier(.22, .78, .2, 1);
      --ease-sheet: cubic-bezier(.32, .72, .2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.92), transparent 38%),
        linear-gradient(180deg, #eef5fb 0%, #c5d9ec 70%, #b8cee4 100%);
      color: var(--ink);
    }

    body {
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }

    button { font: inherit; }

    #app {
      position: fixed;
      inset: 0;
      z-index: 0;
      min-width: 0;
      isolation: isolate;
    }

    #app canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: 0;
    }

    /* The HUD floats above the scene without taking layout space from it. */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      pointer-events: none;
    }

    #overlay::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(73, 93, 129, 0.08), transparent 13%),
        radial-gradient(ellipse at 50% 108%, rgba(48, 70, 111, 0.13), transparent 42%);
      mix-blend-mode: multiply;
    }

    .brand {
      position: absolute;
      inset-block-start: max(0.875rem, env(safe-area-inset-top));
      inset-inline-start: max(var(--page-gutter), env(safe-area-inset-left));
      display: flex;
      align-items: center;
      gap: 0.55rem;
      color: rgba(40, 55, 84, 0.76);
      filter: drop-shadow(0 0.0625rem 0 rgba(255, 255, 255, 0.75));
    }

    .brand-mark {
      display: grid;
      width: 1.75rem;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 0.625rem;
      background: linear-gradient(145deg, rgba(119, 89, 181, 0.86), rgba(73, 44, 124, 0.92));
      box-shadow: 0 0.25rem 0.8rem rgba(69, 48, 112, 0.2), inset 0 1px rgba(255, 255, 255, 0.38);
    }

    .brand-mark svg { width: 1rem; height: 1rem; color: #fff7d7; }

    .brand-copy { display: grid; gap: 0.02rem; }

    .brand-name {
      font-size: 0.82rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand-set {
      color: rgba(75, 89, 116, 0.66);
      font-size: 0.55rem;
      font-weight: 750;
      line-height: 1.15;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .fade {
      transition: opacity 220ms ease, transform 280ms var(--ease-out), filter 280ms ease;
    }

    .hidden {
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #libraryBtn,
    #audioBtn,
    #skipBtn,
    #closeLibrary {
      display: grid;
      place-items: center;
      border: 0;
      cursor: pointer;
      color: var(--ink);
      -webkit-touch-callout: none;
    }

    #libraryBtn,
    #audioBtn {
      position: absolute;
      inset-inline-end: max(var(--page-gutter), env(safe-area-inset-right));
      width: var(--control-size);
      height: var(--control-size);
      pointer-events: auto;
      border: 1px solid var(--glass-edge);
      border-radius: 1rem;
      background: linear-gradient(150deg, rgba(255, 255, 255, 0.88), rgba(229, 238, 249, 0.7));
      box-shadow: 0 0.45rem 1.25rem rgba(53, 76, 119, 0.17), inset 0 1px rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: blur(1rem) saturate(155%);
      backdrop-filter: blur(1rem) saturate(155%);
    }

    #libraryBtn { inset-block-start: max(0.75rem, env(safe-area-inset-top)); }

    #audioBtn {
      inset-block-start: calc(max(0.75rem, env(safe-area-inset-top)) + var(--control-size) + 0.65rem);
    }

    #libraryBtn svg,
    #audioBtn svg { width: 1.35rem; height: 1.35rem; }

    #audioBtn[aria-pressed="false"] .sound-muted,
    #audioBtn[aria-pressed="true"] .sound-wave { display: none; }

    #libraryBtn .count {
      position: absolute;
      inset-inline-end: -0.32rem;
      inset-block-end: -0.32rem;
      display: grid;
      min-width: 1.32rem;
      height: 1.32rem;
      padding-inline: 0.28rem;
      place-items: center;
      border: 2px solid rgba(238, 245, 252, 0.96);
      border-radius: 999px;
      background: linear-gradient(180deg, #ffc55c, #ef8d28);
      box-shadow: 0 0.2rem 0.55rem rgba(177, 91, 18, 0.36);
      color: #fff;
      font-size: 0.66rem;
      font-variant-numeric: tabular-nums;
      font-weight: 850;
      line-height: 1;
    }

    #skipBtn {
      position: absolute;
      inset-inline-end: max(var(--page-gutter), env(safe-area-inset-right));
      inset-block-end: max(1rem, env(safe-area-inset-bottom));
      width: 2.9rem;
      height: 2.9rem;
      pointer-events: auto;
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 50%;
      background: rgba(247, 251, 255, 0.62);
      box-shadow: 0 0.4rem 1rem rgba(53, 76, 119, 0.16), inset 0 1px rgba(255, 255, 255, 0.88);
      -webkit-backdrop-filter: blur(0.9rem) saturate(145%);
      backdrop-filter: blur(0.9rem) saturate(145%);
    }

    #skipBtn svg { width: 1.1rem; height: 1.1rem; }

    #libraryBtn:active,
    #audioBtn:active,
    #skipBtn:active,
    #closeLibrary:active,
    .primaryBtn:active,
    .collectBtn:active,
    .newPackBtn:active { transform: scale(0.94); transition-duration: 80ms; }

    #libraryBtn:focus-visible,
    #audioBtn:focus-visible,
    #skipBtn:focus-visible,
    #closeLibrary:focus-visible,
    .cardTile:focus-visible,
    .primaryBtn:focus-visible,
    .collectBtn:focus-visible,
    .newPackBtn:focus-visible {
      outline: 3px solid rgba(88, 57, 151, 0.75);
      outline-offset: 3px;
    }

    /* Collection is a full-height sheet so the canvas stays mounted behind it. */
    #library {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      visibility: hidden;
      pointer-events: none;
      transform: translate3d(0, 102%, 0) scale(0.985);
      transform-origin: 50% 100%;
      transition: transform 500ms var(--ease-sheet), visibility 0s linear 500ms;
      background:
        radial-gradient(circle at 18% -8%, rgba(255, 255, 255, 0.98), transparent 34%),
        radial-gradient(circle at 98% 18%, rgba(161, 135, 211, 0.14), transparent 30%),
        linear-gradient(180deg, #edf4fb 0%, #d8e6f4 50%, #cbdcec 100%);
      box-shadow: 0 -1.5rem 4rem rgba(43, 59, 93, 0.28);
      touch-action: pan-y;
    }

    #library::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.32;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.65) 0 1px, transparent 1.5px),
        radial-gradient(circle at 70% 68%, rgba(92, 69, 148, 0.12) 0 1px, transparent 1.4px);
      background-size: 4.8rem 4.8rem, 6.5rem 6.5rem;
    }

    #library.open {
      visibility: visible;
      pointer-events: auto;
      transform: translate3d(0, 0, 0) scale(1);
      transition-delay: 0s;
    }

    #library header {
      position: relative;
      z-index: 2;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      min-height: calc(4.9rem + env(safe-area-inset-top));
      padding:
        calc(max(0.75rem, env(safe-area-inset-top)) + 0.25rem)
        calc(max(var(--page-gutter), env(safe-area-inset-right)) + 3.4rem)
        0.8rem
        max(var(--page-gutter), env(safe-area-inset-left));
    }

    .library-heading { min-width: 0; }

    .library-kicker {
      display: block;
      margin-block-end: 0.12rem;
      color: var(--violet);
      font-size: 0.62rem;
      font-weight: 850;
      line-height: 1;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    #library header h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(1.5rem, 6vw, 2rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    #library header .sub {
      display: block;
      min-height: 1.2em;
      margin-block-start: 0.28rem;
      overflow: hidden;
      color: var(--ink-soft);
      font-size: 0.76rem;
      font-weight: 650;
      letter-spacing: 0.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #closeLibrary {
      position: absolute;
      z-index: 3;
      inset-block-start: max(0.85rem, env(safe-area-inset-top));
      inset-inline-end: max(var(--page-gutter), env(safe-area-inset-right));
      width: 2.75rem;
      height: 2.75rem;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.52);
      box-shadow: 0 0.35rem 1rem rgba(54, 75, 111, 0.13), inset 0 1px rgba(255, 255, 255, 0.86);
      -webkit-backdrop-filter: blur(1rem) saturate(145%);
      backdrop-filter: blur(1rem) saturate(145%);
    }

    #closeLibrary svg { width: 1rem; height: 1rem; }

    .collection-meta {
      position: relative;
      z-index: 1;
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 0.5rem;
      margin-inline: max(var(--page-gutter), env(safe-area-inset-left));
      margin-block-end: 0.8rem;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .collection-meta::-webkit-scrollbar { display: none; }

    .meta-chip {
      flex: 0 0 auto;
      padding: 0.42rem 0.72rem;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.48);
      color: #5b6c89;
      font-size: 0.67rem;
      font-weight: 750;
      letter-spacing: 0.035em;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.72);
      white-space: nowrap;
    }

    .meta-chip:first-child {
      background: linear-gradient(145deg, rgba(106, 73, 168, 0.92), rgba(68, 42, 117, 0.92));
      color: #fff;
      border-color: rgba(255, 255, 255, 0.34);
      box-shadow: 0 0.3rem 0.8rem rgba(72, 46, 121, 0.2), inset 0 1px rgba(255, 255, 255, 0.24);
    }

    #library .grid {
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-content: start;
      gap: clamp(0.65rem, 3vw, 1rem);
      width: min(100%, 72rem);
      min-height: 0;
      margin-inline: auto;
      padding:
        0.35rem
        max(var(--page-gutter), env(safe-area-inset-right))
        calc(max(2rem, env(safe-area-inset-bottom)) + 0.75rem)
        max(var(--page-gutter), env(safe-area-inset-left));
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scrollbar-gutter: stable;
      -webkit-overflow-scrolling: touch;
    }

    #library .cardTile {
      position: relative;
      min-width: 0;
      aspect-ratio: 1024 / 1430;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.84);
      border-radius: 5.4% / 3.9%;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(214, 227, 242, 0.9));
      box-shadow:
        0 0.5rem 1rem rgba(47, 65, 102, 0.16),
        0 0.08rem 0.2rem rgba(47, 65, 102, 0.18),
        inset 0 1px rgba(255, 255, 255, 0.92);
      animation: tileIn 480ms var(--ease-out) both;
      container-type: inline-size;
    }

    #library .cardTile::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background: linear-gradient(118deg, transparent 30%, rgba(255, 255, 255, 0.28) 46%, transparent 60%);
      opacity: 0;
      transform: translateX(-70%);
      transition: opacity 180ms ease, transform 500ms var(--ease-out);
    }

    #library .cardTile:hover::after,
    #library .cardTile:focus-visible::after { opacity: 1; transform: translateX(70%); }

    #library .cardTile img,
    #library .cardTile canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #library .cardTile .dupe {
      position: absolute;
      z-index: 2;
      inset-inline-end: max(0.28rem, 4cqw);
      inset-block-end: max(0.28rem, 4cqw);
      display: grid;
      min-width: 1.45rem;
      min-height: 1.25rem;
      padding: 0.18rem 0.42rem;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      background: rgba(27, 37, 62, 0.78);
      box-shadow: 0 0.2rem 0.5rem rgba(20, 28, 48, 0.25);
      -webkit-backdrop-filter: blur(0.45rem);
      backdrop-filter: blur(0.45rem);
      color: #fff;
      font-size: clamp(0.58rem, 11cqw, 0.72rem);
      font-variant-numeric: tabular-nums;
      font-weight: 850;
      line-height: 1;
    }

    @keyframes tileIn {
      from { opacity: 0; transform: translate3d(0, 0.8rem, 0) scale(0.94); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }

    #library .empty {
      grid-column: 1 / -1;
      display: grid;
      min-height: min(46svh, 22rem);
      padding: 2rem;
      place-items: center;
      align-content: center;
      gap: 0.7rem;
      color: var(--ink-soft);
      font-size: 0.88rem;
      font-weight: 650;
      text-align: center;
      text-wrap: balance;
    }

    #library .empty::before {
      content: "✦";
      display: grid;
      width: 3.4rem;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 1.15rem;
      background: rgba(255, 255, 255, 0.45);
      box-shadow: 0 0.6rem 1.4rem rgba(62, 78, 112, 0.12), inset 0 1px rgba(255, 255, 255, 0.92);
      color: var(--violet);
      font-size: 1.3rem;
    }

    /* Hooks for the end-of-pack summary generated by the game controller. */
    .summary,
    .summaryPanel {
      position: fixed;
      inset-inline: max(var(--page-gutter), env(safe-area-inset-left));
      inset-block-end: max(1rem, env(safe-area-inset-bottom));
      z-index: 20;
      display: grid;
      justify-items: center;
      gap: 0.9rem;
      pointer-events: auto;
    }

    .summary-row,
    .summaryRow {
      display: flex;
      width: min(100%, 31rem);
      min-width: 0;
      align-items: flex-end;
      justify-content: center;
      padding-inline: 1rem;
    }

    .summary-card,
    .summaryCard {
      width: min(20vw, 6.1rem);
      aspect-ratio: 1024 / 1430;
      margin-inline: clamp(-0.45rem, -1.3vw, -0.12rem);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.88);
      border-radius: 5% / 3.5%;
      background: #fff;
      box-shadow: 0 0.45rem 1rem rgba(38, 53, 86, 0.2);
    }

    .summary-card img,
    .summaryCard img,
    .summary-card canvas,
    .summaryCard canvas { display: block; width: 100%; height: 100%; object-fit: cover; }

    .summary-actions,
    .summaryActions { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.65rem; }

    .primaryBtn,
    .collectBtn,
    .newPackBtn {
      min-height: 3rem;
      padding: 0.75rem 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      background: linear-gradient(145deg, var(--violet), var(--violet-deep));
      box-shadow: 0 0.55rem 1.25rem rgba(69, 43, 118, 0.3), inset 0 1px rgba(255, 255, 255, 0.3);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    @media (min-width: 34rem) {
      #library .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (min-width: 50rem) {
      #library .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      #library header,
      .collection-meta { width: min(100%, 72rem); margin-inline: auto; }
      .collection-meta { padding-inline: var(--page-gutter); }
      #closeLibrary { inset-inline-end: max(calc((100vw - 72rem) / 2 + var(--page-gutter)), var(--page-gutter)); }
    }

    @media (orientation: landscape) and (max-height: 36rem) {
      :root { --control-size: 2.75rem; }
      .brand { inset-block-start: max(0.55rem, env(safe-area-inset-top)); }
      .brand-set { display: none; }
      #libraryBtn { inset-block-start: max(0.5rem, env(safe-area-inset-top)); }
      #audioBtn { inset-block-start: calc(max(0.5rem, env(safe-area-inset-top)) + var(--control-size) + 0.5rem); }
      #skipBtn { inset-block-end: max(0.6rem, env(safe-area-inset-bottom)); }
      #library header { min-height: calc(4.1rem + env(safe-area-inset-top)); padding-block-end: 0.5rem; }
      #library header h1 { font-size: 1.35rem; }
      #library header .sub { display: inline; margin-inline-start: 0.55rem; }
      .collection-meta { position: absolute; inset-block-start: max(1rem, env(safe-area-inset-top)); inset-inline-start: 11rem; width: auto; margin: 0; }
      #library .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 120ms !important;
      }

      #library { transform: none; opacity: 0; }
      #library.open { opacity: 1; }
      #library .cardTile::after { display: none; }
    }

    @media (prefers-reduced-transparency: reduce) {
      #libraryBtn,
      #audioBtn,
      #skipBtn,
      #closeLibrary,
      .meta-chip { background: #f5f8fc; }
      #libraryBtn,
      #audioBtn,
      #skipBtn,
      #closeLibrary,
      .meta-chip { -webkit-backdrop-filter: none; backdrop-filter: none; }

    @media (prefers-contrast: more) {
      #libraryBtn,
      #audioBtn,
      #skipBtn,
      #closeLibrary { border: 2px solid #394967; background: #fff; }
      #library .cardTile { border-color: #50617f; box-shadow: 0 0 0 1px #fff; }
      #library header .sub, .meta-chip, #library .empty { color: #3e4f6d; }
    }

    @media (forced-colors: active) {
      #overlay::after, #library::before { display: none; }
      #libraryBtn, #audioBtn, #skipBtn, #closeLibrary, .meta-chip, #library .cardTile {
        border: 1px solid ButtonText;
        box-shadow: none;
      }
    }
  </style>

<body>
  <main id="app" aria-label="Lumen booster pack opening"></main>

  <div id="overlay" aria-label="Game controls">

    <button id="audioBtn" class="fade" type="button" aria-label="Mute sound" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 9.2h3.3l4-3.4v12.4l-4-3.4H5V9.2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        <path class="sound-wave" d="M15.2 9.1a4.2 4.2 0 0 1 0 5.8M17.5 6.7a7.6 7.6 0 0 1 0 10.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <path class="sound-muted" d="m15.5 9 5 5m0-5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </svg>
    </button>

    <button id="skipBtn" class="fade hidden" type="button" aria-label="Skip animation">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m5.5 6.5 7 5.5-7 5.5v-11ZM13 6.5l5.5 5.5-5.5 5.5v-11ZM19 6.5v11" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </div>

  <section id="library" role="dialog" aria-modal="true" aria-labelledby="libraryTitle">
    <header>
      <div class="library-heading">
        <span class="library-kicker">Card archive</span>
        <h1 id="libraryTitle">Collection</h1>
        <span class="sub" id="libStats" aria-live="polite"></span>
      </div>
    </header>

    <button id="closeLibrary" type="button" aria-label="Close collection">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
      </svg>
    </button>

    <div class="collection-meta" aria-hidden="true">
      <span class="meta-chip">Aurora Grove</span>
      <span class="meta-chip">Series 01</span>
      <span class="meta-chip">Saved on this device</span>
    </div>

    <div class="grid" id="libGrid" aria-label="Collected cards"></div>
  </section>

</body>
</html>
